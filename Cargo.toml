[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Spencer Stone"]
license = "MIT"

[workspace.dependencies]
relight-ffmpeg = { path = "crates/ffmpeg" }
relight-media = { path = "crates/media" }
relight-recorder = { path = "crates/recorder" }

chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
ffmpeg-sidecar = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

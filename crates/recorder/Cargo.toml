[package]
name = "relight-recorder"
description = "Recording the screen (ddagrab and NVENC) and its sound (WASAPI) into an MP4"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
relight-ffmpeg.workspace = true
cpal.workspace = true
ffmpeg-sidecar.workspace = true
serde.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true
